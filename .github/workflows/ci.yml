name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - name: Smoke-test evidence pipeline
        run: python -m drone_hive.cli --quick --output results/ci-smoke
      - name: Run Stage Two diagnostic fault matrix
        run: python -m drone_hive.stage_two_smoke --output results/stage-two-diagnostic
      - uses: actions/upload-artifact@v4
        with:
          name: stage-two-diagnostic-py${{ matrix.python-version }}
          path: results/stage-two-diagnostic/
      - name: Run seven-arm Stage Two exploratory ablation
        run: python -m drone_hive.stage_two_ablation --output results/stage-two-ablation
      - uses: actions/upload-artifact@v4
        with:
          name: stage-two-ablation-py${{ matrix.python-version }}
          path: results/stage-two-ablation/
      - name: Install virtual display for GUI smoke test
        if: matrix.python-version == '3.12'
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb
      - name: Exercise actual GUI and capture screenshots
        if: matrix.python-version == '3.12'
        run: xvfb-run -a -s "-screen 0 1920x1080x24" python -m drone_hive.ui_smoke
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: drone-hive-real-gui-screenshots
          path: demos/ui-smoke/
      - name: Render model-driven colony web demo
        if: matrix.python-version == '3.12'
        run: python -m drone_hive.web_demo
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: drone-hive-colony-web-animated-demo
          path: demos/colony-web-operational.gif
      - uses: actions/upload-artifact@v4
        with:
          name: drone-hive-evidence-py${{ matrix.python-version }}
          path: results/ci-smoke/
