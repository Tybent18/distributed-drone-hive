name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - name: Smoke-test evidence pipeline
        run: python -m drone_hive.cli --quick --output results/ci-smoke
      - name: Render model-driven colony web demo
        if: matrix.python-version == '3.12'
        run: python -m drone_hive.web_demo
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: drone-hive-colony-web-animated-demo
          path: demos/colony-web-operational.gif
      - uses: actions/upload-artifact@v4
        with:
          name: drone-hive-evidence-py${{ matrix.python-version }}
          path: results/ci-smoke/
