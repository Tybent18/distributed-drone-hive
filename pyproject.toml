[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "distributed-drone-hive"
version = "0.1.0"
description = "A reproducible laboratory for infrastructure-driven swarm robotics."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Tybent18"}]
dependencies = ["matplotlib>=3.7", "numpy>=1.24", "Pillow>=10.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
drone-hive-experiment = "drone_hive.cli:main"
drone-hive-dashboard = "drone_hive.dashboard:main"

[tool.setuptools.packages.find]
include = ["drone_hive*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
